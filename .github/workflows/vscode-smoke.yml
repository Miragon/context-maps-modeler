# The packaged extension in a real VS Code (npm run test:vscode). ci.yml calls it as the job
# vscode-smoke, so its result is part of the ci-ok gate; vscode-smoke-weekly.yml calls it every
# Monday to catch a new VS Code release. It downloads VS Code and drives a desktop app, so on a pull
# request, a push and in the merge queue it runs only when a file the packed extension or the test
# depends on changed; the job `changes` decides. Run it by hand under Actions → VS Code smoke → Run
# workflow, on any branch.
name: VS Code smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # What the packed extension is built from (the extension, the packages it bundles from source
      # with the compiler options of tsconfig.base.json, every manifest and the lockfile) and what
      # runs the test (the Vitest config, the setup action and the workflows that call it).
      - id: decide
        name: Decide whether a path the packed extension depends on changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          decide() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
          }
          is_relevant() {
            case "$1" in
              package-lock.json | package.json | */package.json) ;;
              apps/vscode/* | packages/*) ;;
              tsconfig.base.json | vitest.config.ts | .github/actions/setup/*) ;;
              .github/workflows/ci.yml | .github/workflows/vscode-smoke.yml | .github/workflows/vscode-smoke-weekly.yml) ;;
              *) return 1 ;;
            esac
          }
          case "$EVENT_NAME" in
            pull_request) base="$PULL_REQUEST_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            merge_group) base="$MERGE_GROUP_BASE_SHA" ;;
            *)
              decide true "A $EVENT_NAME run always runs the smoke test."
              exit 0
              ;;
          esac
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            decide true "No base commit to compare with ('$base'): the smoke test runs."
            exit 0
          fi
          # --no-renames lists a moved file under its old path too, and quotePath=false keeps a
          # non-ASCII path unquoted, so both still match a pattern above.
          if ! git fetch --no-tags --depth=1 origin "$base" ||
            ! changed=$(git -c core.quotePath=false diff --no-renames --name-only "$base" HEAD); then
            decide true "Cannot compare with the base commit $base: the smoke test runs."
            exit 0
          fi
          relevant=()
          while IFS= read -r path; do
            if [[ -n "$path" ]] && is_relevant "$path"; then relevant+=("$path"); fi
          done <<< "$changed"
          if [[ ${#relevant[@]} -gt 0 ]]; then
            decide true "${#relevant[@]} relevant path(s) changed since $base, the smoke test runs: ${relevant[*]}"
          else
            decide false "No path the packed extension or the test depends on changed since $base: the smoke test is skipped."
          fi

  vscode-smoke:
    name: VS Code ${{ matrix.vscode }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # minimum: the engines.vscode floor the extension promises; stable: the newest release.
        vscode: [minimum, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Resolve the VS Code version
        id: vscode
        env:
          TRACK: ${{ matrix.vscode }}
        run: |
          if [ "$TRACK" = "minimum" ]; then
            version=$(node -p "require('semver').minVersion(require('./apps/vscode/package.json').engines.vscode).version")
          else
            version=$(curl -fsSL https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')
          fi
          echo "VS Code $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The driver's download folder on Linux ($XDG_CACHE_HOME, which GitHub's runners leave unset),
      # one cache entry per version, so a new release starts a fresh one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/miragon-modeler-shell/vscode-test
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode.outputs.version }}
      - run: xvfb-run -a npm run test:vscode
        env:
          VSCODE_VERSION: ${{ steps.vscode.outputs.version }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-${{ matrix.vscode }}
          path: test-results/vscode-smoke/
          retention-days: 7

  # With the matrix skipped the called workflow still has to end in a success: ci-ok fails on a
  # skipped vscode-smoke, since a skip looks the same as a smoke test that never got to run.
  not-needed:
    name: VS Code smoke not needed
    needs: changes
    if: needs.changes.outputs.run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "::notice title=VS Code smoke::Nothing the smoke test depends on changed, so it did not run."
